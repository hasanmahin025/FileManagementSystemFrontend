<div class="main-content">
    <main class="content-area">
        <div class="toolbar">
            <div style="display: flex; align-items: center; gap: 12px;">
                <button *ngIf="currentFolderId !== null" (click)="goBack()" class="back-btn" title="go back">
                    <i class="fas fa-arrow-left"></i>
                </button>
                <h3>My Drive</h3>
            </div>
        </div>

          <div *ngIf="!isLoading && contents.folders.length>0" class="section">
            <h4>Folders</h4>
            <div class="grid-container">
                <button class="card"  *ngFor="let folder of contents.folders"  (click)="onFolderClick(folder.id)">
                    <div class="card-preview">
                        <i class="fas fa-folder"></i>
                        <div class="menu" [class.active]="activeMenuId === folder.id && activeMenuType === 'folder'" >
                            <button class="kebab-icon" (click)="toggleMenu(folder.id , 'folder' , $event)">⋮</button>
                            <ul class="dropdown" *ngIf="activeMenuId === folder.id && activeMenuType === 'folder'" (click)="$event.stopPropagation()">
                                <li (click)="onFolderClick(folder.id)">Open</li>
                                <li>Share</li>
                                <li (click)="handleAction('Add to Favourite', folder); $event.stopPropagation()">Add to Favourite</li>
                                <li (click)="handleAction('move to Trash', folder); $event.stopPropagation()">Move to Trash</li>
                            </ul>
                        </div>
                    </div>
                    <div class="card-info">
                        <span class="card-title">{{folder.name}}</span>
                    </div>

                </button>
          </div>
          </div>
          <div *ngIf="!isLoading && contents.files.length>0" class="section">
            <h4>Files</h4>
          <div class="grid-container">
            <div class="card" *ngFor="let file of contents.files">
                <div class="card-preview">
                    <i class="fas"
                     [class.fa-file-image]="file.fileName.endsWith('.jpg') || file.fileName.endsWith('.png')"
                     [class.fa-file-pdf]="file.fileName.endsWith('.pdf')"
                     [class.fa-file]="!file.fileName.endsWith('jpg') && !file.fileName.endsWith('.pdf')"></i>
                    <div class="menu" [class.active]="activeMenuId === file.id && activeMenuType === 'file'" >
                        <button class="kebab-icon"(click)="toggleMenu(file.id, 'file', $event)">⋮</button>
                        <ul class="dropdown" *ngIf="activeMenuId === file.id && activeMenuType==='file'"
                        (click)="$event.stopPropagation()">
                            <li>Preview</li>
                            <li (click)="handleFileAction('Download',file); $event.stopPropagation()" >Download</li>
                            <li>Share</li>
                            <li (click)="handleFileAction('Add to Favourite' , file); $event.stopPropagation()">Add to Favourite</li>
                            <li (click)="handleFileAction('Delete' , file); $event.stopPropagation()">Move to Trash</li>
                        </ul>
                    </div>
                </div>
                <div class="card-info">
                    <span class="card-title">{{file.fileName}}</span>
                    
                </div>
            </div>
          </div>
          </div>
          <div *ngIf="contents.folders.length === 0 && contents.files.length === 0" class="empty-state">
            <i class="fas fa-folder-open"></i>
            <p>Create a new Folder or Upload a file</p>
          </div> 
    </main>

</div>
