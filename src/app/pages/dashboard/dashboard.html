<div class="dashboard-container">
    <!--Header-->
    <header class="dashboard-header">
        <div class="header-left">
            <div class="logo">
                <i class="fas fa-folder icon-large"></i>
                <span class="logo-text">Drive</span>
            </div>
        </div>
        <div class="header-center">
            <div class="search-bar">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="Search in Drive">
            </div>
        </div>
        <div class="header-right">
            <button class="icon-btn" title="View">
                <i class="fas fa-cog"></i>
            </button>
            <div class="user-avatar">
                <i class="fas fa-user-circle icon-large"></i>
            </div>
        </div>
    </header>

    <!--Main Cintent-->
    <div class="main-content">
        <!--Sidebar-->
        <aside class="sidebar">
            <button class="new-btn">
                <i class="fas fa-plus-circle icon-medium"></i>
                <span>New</span>
            </button>
            <nav class="sidebar-nav">
               <a class="nav-item active">
                <i class="fas fa-hdd"></i>
                <span>My Drive</span>
               </a>
               <a class="nav-item">
                <i class="fas fa-user-friends"></i>
                <span>Shared with me</span>
               </a>
               <a class="nav-item">
                <i class="fas fa-user-plus"></i>
                <span>Shared by me</span>
               </a>
               <a class="nav-item">
                <i class="fas fa-clock"></i>
                 <span>Recent</span>         
               </a>
               <a class="nav-item">
                <i class="fas fa-star"></i>
                <span>Favourite</span>
               </a>
               <a class="nav-item">
                <i class="fas fa-trash"></i>
                <span>Trash</span>
                
               </a>
               <a class="nav-item">
                <i class="fas fa-user-tie"></i>
                <span>Admin</span>
               </a>
            </nav>

            <div class="storage-info">
          <div class="storage-bar">
            <div class="storage-used" style="width: 35%"></div>
          </div>
          <p class="storage-text">0.0 GB of 15 GB used</p>
              <h4>Storage</h4>
            </div>
        </aside>
        <!--Content-Area-->
        <main class="content-area">
            <div class="breadcrumb">
                <button class="breadcrumb-item">
                    <i class="fas fa-home"></i>
                    <span>My Drive</span>
                </button>
            </div>
            <!--Toolbar-->
            <div class="toolbar">
                <div class="toolbar-left">
                    <button class="bth-icon" title="New folder">
                        <i class="fas fa-folder-plus" style="font-size:25px;"></i>
                    </button>
                    <button class="bth-icon" title="Upload files">
                        <i class="fas fa-upload" style="font-size: 25px;"></i>
                    </button>
                </div>
                
            </div>
            <div class="section">
          <h3 class="section-title">Folders</h3>
          <div class="grid-view">
            <div class="grid-item folder-item">
              <div class="item-icon">
                <i class="fas fa-folder icon-large folder-color"></i>
              </div>
              <div class="item-content">
                <div class="item-name">Name</div>
                <div class="item-meta">00 items</div>
              </div>
            </div>
          </div>
        </div>
        </main>
    </div>
</div>
