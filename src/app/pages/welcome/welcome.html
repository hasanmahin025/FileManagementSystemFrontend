<app-navbar></app-navbar>
<div class="container">
    <div class="text-content">
        <h1 class="title">
            <span>Welcome</span>
            <span>To</span>
            <span>File Management</span>
            <span>System</span>
        </h1>
        <p class="subtitle">Secure, Admin-Managed Storage for your Organization.</p>
        <div class="btn-class" routerLink = "/login">Login to Access</div>
      
    </div>
     <div class="image-content">
        <!-- UPDATED: Changed viewBox from "0 0 400 400" to "40 40 320 320" to zoom in -->
        <svg viewBox="40 40 320 320" xmlns="http://www.w3.org/2000/svg" class="hero-img">
            <defs>
                <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.1"/>
                </filter>
            </defs>

            <!-- Background Abstract Blobs -->
            <circle cx="200" cy="200" r="140" fill="#ecfdf5" opacity="0.6"/>
            <circle cx="280" cy="120" r="40" fill="#d1fae5" opacity="0.5"/>
            <circle cx="100" cy="280" r="30" fill="#a7f3d0" opacity="0.4"/>

            <!-- Main Cloud Server Base -->
            <path d="M120,260 L280,260 C300,260 310,240 310,220 L310,180 C310,160 300,140 280,140 L260,140 C260,110 240,90 200,90 C160,90 140,110 140,140 L120,140 C100,140 90,160 90,180 L90,220 C90,240 100,260 120,260 Z"
                  fill="white" stroke="#10b981" stroke-width="3" filter="url(#shadow)"/>
            
            <!-- Server Lines -->
            <line x1="130" y1="230" x2="270" y2="230" stroke="#d1fae5" stroke-width="4" stroke-linecap="round"/>
            <line x1="130" y1="210" x2="270" y2="210" stroke="#d1fae5" stroke-width="4" stroke-linecap="round"/>
            
            <!-- Blinking Status Light -->
            <circle cx="280" cy="220" r="4" fill="#34d399">
                <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
            </circle>

            <!-- File 1: PDF Document (Floating Left) -->
            <g transform="translate(80, 160)">
                <animateTransform attributeName="transform" type="translate" values="80,160; 80,150; 80,160" dur="4s" repeatCount="indefinite"/>
                <rect x="0" y="0" width="50" height="65" rx="6" fill="#ef4444" filter="url(#shadow)"/>
                <rect x="0" y="0" width="50" height="65" rx="6" fill="white" opacity="0.9"/>
                <rect x="10" y="45" width="30" height="4" rx="2" fill="#ef4444" opacity="0.5"/>
                <rect x="10" y="53" width="20" height="4" rx="2" fill="#ef4444" opacity="0.5"/>
                <text x="10" y="30" font-family="sans-serif" font-weight="bold" font-size="14" fill="#ef4444">PDF</text>
            </g>

            <!-- File 2: Image File (Floating Right) -->
            <g transform="translate(280, 130)">
                <animateTransform attributeName="transform" type="translate" values="280,130; 280,140; 280,130" dur="5s" repeatCount="indefinite"/>
                <rect x="0" y="0" width="60" height="50" rx="6" fill="#3b82f6" filter="url(#shadow)"/>
                <rect x="0" y="0" width="60" height="50" rx="6" fill="white" opacity="0.9"/>
                <circle cx="15" cy="15" r="5" fill="#3b82f6" opacity="0.5"/>
                <path d="M50,40 L40,25 L30,35 L20,20 L10,40 Z" fill="#3b82f6" opacity="0.5"/>
            </g>

            <!-- File 3: Folder (Center Bottom) -->
            <g transform="translate(160, 240)">
                <path d="M0,15 L25,15 L35,5 L80,5 L80,55 L0,55 Z" fill="#10b981" filter="url(#shadow)"/>
                <path d="M0,55 L10,20 L80,20 L70,55 Z" fill="#34d399" opacity="0.9"/>
            </g>

            <!-- Security Shield (Center) -->
            <g transform="translate(180, 160)">
                <path d="M20,0 L40,10 L40,25 C40,45 20,55 20,55 C20,55 0,45 0,25 L0,10 Z" fill="#10b981"/>
                <path d="M20,15 L25,25 L32,25 L26,30 L28,38 L20,33 L12,38 L14,30 L8,25 L15,25 Z" fill="white"/>
            </g>
        </svg>
    </div>

</div>

<!-- Wave Background -->

        <defs>
            <linearGradient id="wave-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" style="stop-color:#d1fae5;stop-opacity:1" /> <!-- Mint -->
                <stop offset="100%" style="stop-color:#22d3ee;stop-opacity:1" /> <!-- Cyan -->
            </linearGradient>

        <!-- Lighter Back Wave -->
        <path fill="#e0f2fe" fill-opacity="1" d="M0,224L48,213.3C96,203,192,181,288,181.3C384,181,480,203,576,224C672,245,768,267,864,261.3C960,256,1056,224,1152,186.7C1248,149,1344,107,1392,85.3L1440,64L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path>

    </svg>
</div>
